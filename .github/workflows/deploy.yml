name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deployments at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for AWS

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::865526619696:role/ctm-github-deploy
  ECR_REGISTRY: 865526619696.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run API tests
        working-directory: app
        run: npm test

  build_and_push:
    needs: test
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the OIDC subject AWS will check
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); print('sub =', json.loads(base64.urlsafe_b64decode(p))['sub'])" "$TOKEN" || true

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/ctm-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/ctm-api:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.ECR_REGISTRY }}/ctm-web:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/ctm-web:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Record the image tag to deploy
        run: |
          aws ssm put-parameter --name /ctm/image_tag --type String \
            --value "${{ github.sha }}" --overwrite

      - name: Run the deploy script on the instances
        id: send
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:app,Values=ctm \
            --parameters 'commands=["/opt/ctm/deploy.sh"]' \
            --comment "deploy ${GITHUB_SHA::7}" \
            --query Command.CommandId --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for every instance to finish
        run: |
          CMD_ID=${{ steps.send.outputs.command_id }}
          for i in $(seq 1 40); do
            sleep 10
            STATUSES=$(aws ssm list-command-invocations --command-id "$CMD_ID" \
              --query 'CommandInvocations[].Status' --output text)
            echo "[$i] $STATUSES"
            if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qE 'Pending|InProgress|Delayed'; then
              break
            fi
          done
          aws ssm list-command-invocations --command-id "$CMD_ID" --details \
            --query 'CommandInvocations[].[InstanceId,Status,CommandPlugins[0].Output]' --output text
          if [ -z "$STATUSES" ] || echo "$STATUSES" | tr '\t' '\n' | grep -vq '^Success$'; then
            echo "Deployment failed on at least one instance"; exit 1
          fi

      - name: Health check through the load balancer
        run: |
          BASE="http://$(aws elbv2 describe-load-balancers --names ctm-alb \
            --query 'LoadBalancers[0].DNSName' --output text)"
          echo "BASE=$BASE"
          for i in $(seq 1 10); do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/healthz")
            API=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/notes")
            echo "health=$HEALTH api=$API"
            [ "$HEALTH" = 200 ] && [ "$API" = 200 ] && exit 0
            sleep 6
          done
          exit 1
