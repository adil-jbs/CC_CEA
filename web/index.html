<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e4e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --accent-soft: #eef2ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --high: #dc2626;
      --high-bg: #fee2e2;
      --medium: #b45309;
      --medium-bg: #fef3c7;
      --low: #15803d;
      --low-bg: #dcfce7;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .06);
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1020;
        --surface: #121a2e;
        --surface-2: #0f1628;
        --border: #222c45;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-2: #a78bfa;
        --accent-soft: #1e2546;
        --danger: #f87171;
        --danger-soft: #2a1618;
        --high: #fca5a5;
        --high-bg: #3b1518;
        --medium: #fcd34d;
        --medium-bg: #3a2a0c;
        --low: #86efac;
        --low-bg: #0f2e1c;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1020;
      --surface: #121a2e;
      --surface-2: #0f1628;
      --border: #222c45;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #818cf8;
      --accent-2: #a78bfa;
      --accent-soft: #1e2546;
      --danger: #f87171;
      --danger-soft: #2a1618;
      --high: #fca5a5;
      --high-bg: #3b1518;
      --medium: #fcd34d;
      --medium-bg: #3a2a0c;
      --low: #86efac;
      --low-bg: #0f2e1c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    /* ---------- Header ---------- */
    header {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #fff;
      padding: 28px 16px 84px;
    }

    .bar {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .18);
      flex: none;
    }

    .bar h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .bar p {
      margin: 2px 0 0;
      opacity: .85;
      font-size: 13px;
    }

    .theme-btn {
      margin-left: auto;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      display: grid;
      place-items: center;
    }

    .theme-btn:hover {
      background: rgba(255, 255, 255, .28);
    }

    main {
      max-width: 760px;
      margin: -60px auto 40px;
      padding: 0 16px;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ---------- Progress ---------- */
    .stats {
      padding: 18px 20px;
      display: grid;
      gap: 12px;
    }

    .stats-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats-row strong {
      font-size: 18px;
    }

    .stats-row span {
      color: var(--muted);
      font-size: 13px;
    }

    .track {
      height: 8px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .4s ease;
    }

    /* ---------- Add form ---------- */
    form {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 130px 160px auto;
      gap: 10px;
    }

    .field {
      height: 44px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      min-width: 0;
    }

    .field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .add-btn {
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .add-btn:hover {
      filter: brightness(1.08);
    }

    .add-btn:disabled {
      opacity: .6;
      cursor: progress;
    }

    #error {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    }

    #error.show {
      display: block;
    }

    /* ---------- Filters ---------- */
    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .list-head h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .tabs {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .tab .n {
      opacity: .7;
      margin-left: 4px;
    }

    .tab[aria-selected="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
    }

    /* ---------- Tasks ---------- */
    ul {
      list-style: none;
      margin: 0;
      padding: 6px;
    }

    li {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 10px;
      transition: background .15s;
    }

    li:hover {
      background: var(--surface-2);
    }

    li+li {
      border-top: 1px solid var(--border);
    }

    li:hover+li,
    li:hover {
      border-color: transparent;
    }

    .check {
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid var(--border);
      background: var(--surface);
      display: grid;
      place-items: center;
      transition: all .15s;
    }

    .check:hover {
      border-color: var(--accent);
    }

    .check:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check:checked::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: translateY(-1px) rotate(45deg);
    }

    .check:focus-visible {
      outline: 3px solid var(--accent-soft);
    }

    .body {
      min-width: 0;
    }

    .title {
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    li.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 99px;
    }

    .pill.High {
      color: var(--high);
      background: var(--high-bg);
    }

    .pill.Medium {
      color: var(--medium);
      background: var(--medium-bg);
    }

    .pill.Low {
      color: var(--low);
      background: var(--low-bg);
    }

    .due {
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 99px;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .due.overdue {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: transparent;
      font-weight: 600;
    }

    .due.today {
      color: var(--medium);
      background: var(--medium-bg);
      border-color: transparent;
      font-weight: 600;
    }

    li.done .pill,
    li.done .due {
      opacity: .55;
    }

    .del {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: .55;
      transition: all .15s;
    }

    li:hover .del,
    .del:focus-visible {
      opacity: 1;
    }

    .del:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty {
      padding: 44px 16px;
      text-align: center;
      color: var(--muted);
    }

    .empty svg {
      opacity: .5;
      margin-bottom: 8px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 15px;
      margin-bottom: 2px;
    }

    .skeleton {
      height: 18px;
      margin: 18px 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2));
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }

    @keyframes shimmer {
      to {
        background-position: -200% 0;
      }
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 0 16px 32px;
    }

    footer code {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 6px;
    }

    @media (max-width: 640px) {
      form {
        grid-template-columns: 1fr 1fr;
      }

      form #title {
        grid-column: 1 / -1;
      }

      .add-btn {
        grid-column: 1 / -1;
        justify-content: center;
      }

      header {
        padding-bottom: 76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="bar">
      <div class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
          <path d="m9 13 2 2 4-4" />
        </svg>
      </div>
      <div>
        <h1>Cloud Computing Lab</h1>
        <p>Nginx → Node.js API → Amazon RDS MySQL, on AWS</p>
      </div>
      <button class="theme-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card stats" aria-label="Progress">
      <div class="stats-row">
        <strong id="progress-text">Loading…</strong>
        <span id="progress-sub"></span>
      </div>
      <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track">
        <div class="fill" id="fill"></div>
      </div>
    </section>

    <section class="card" aria-label="Add a task">
      <form id="form">
        <input class="field" id="title" placeholder="What needs to be done?" maxlength="120" required
          autocomplete="off">
        <select class="field" id="priority" aria-label="Priority">
          <option>Low</option>
          <option selected>Medium</option>
          <option>High</option>
        </select>
        <input class="field" id="due_date" type="date" aria-label="Due date">
        <button class="add-btn" id="add" type="submit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          Add task
        </button>
      </form>
    </section>

    <div id="error" role="alert"></div>

    <section class="card" aria-label="Tasks">
      <div class="list-head">
        <h2>Tasks</h2>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-filter="all" aria-selected="true">All<span class="n"
              id="n-all"></span></button>
          <button class="tab" role="tab" data-filter="active" aria-selected="false">Active<span class="n"
              id="n-active"></span></button>
          <button class="tab" role="tab" data-filter="done" aria-selected="false">Done<span class="n"
              id="n-done"></span></button>
        </div>
      </div>
      <ul id="list">
        <li class="skeleton" aria-hidden="true"></li>
        <li class="skeleton" aria-hidden="true"></li>
      </ul>
    </section>
  </main>

  <footer>3-tier app on AWS · release <code>__APP_VERSION__</code></footer>

  <script>
    const $ = (id) => document.getElementById(id);
    let tasks = [];
    let filter = 'all';

    // ---------- Theme (remembered per browser) ----------
    const root = document.documentElement;
    try { const saved = localStorage.getItem('theme'); if (saved) root.dataset.theme = saved; } catch { }
    $('theme').onclick = () => {
      const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = dark ? 'light' : 'dark';
      try { localStorage.setItem('theme', root.dataset.theme); } catch { }
    };

    // ---------- API ----------
    async function api(path, options = {}) {
      const res = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!res.ok && res.status !== 204) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed');
      return res.status === 204 ? null : res.json();
    }

    function showError(msg) {
      $('error').textContent = msg || '';
      $('error').classList.toggle('show', Boolean(msg));
    }

    // ---------- Rendering ----------
    const ICON_TRASH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>';

    function dueInfo(dateStr) {
      if (!dateStr) return null;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const due = new Date(dateStr + 'T00:00:00');
      const days = Math.round((due - today) / 86400000);
      const label = due.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: due.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
      if (days < 0) return { text: `Overdue · ${label}`, cls: 'overdue' };
      if (days === 0) return { text: 'Due today', cls: 'today' };
      if (days === 1) return { text: 'Due tomorrow', cls: '' };
      return { text: `Due ${label}`, cls: '' };
    }

    function render() {
      const done = tasks.filter((t) => t.done).length;
      const total = tasks.length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      $('progress-text').textContent = total ? `${done} of ${total} tasks done` : 'No tasks yet';
      $('progress-sub').textContent = total ? `${pct}% complete · ${total - done} remaining` : 'Add your first task below';
      $('fill').style.width = pct + '%';
      $('track').setAttribute('aria-valuenow', pct);
      $('n-all').textContent = total;
      $('n-active').textContent = total - done;
      $('n-done').textContent = done;

      const shown = tasks.filter((t) => filter === 'all' || (filter === 'done' ? t.done : !t.done));
      const list = $('list');
      list.replaceChildren();

      if (!shown.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.style.display = 'block';
        li.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';
        const strong = document.createElement('strong');
        strong.textContent = filter === 'done' ? 'Nothing finished yet' : filter === 'active' ? 'All caught up!' : 'Your list is empty';
        const p = document.createElement('div');
        p.textContent = filter === 'all' ? 'Add a task above to get started.' : 'Try another filter.';
        li.append(strong, p);
        list.append(li);
        return;
      }

      for (const t of shown) {
        const li = document.createElement('li');
        if (t.done) li.className = 'done';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'check';
        check.checked = t.done;
        check.setAttribute('aria-label', `Mark "${t.title}" as ${t.done ? 'not done' : 'done'}`);
        check.onchange = () => run(() => api(`/tasks/${t.id}`, { method: 'PATCH', body: JSON.stringify({ done: check.checked }) }));

        const body = document.createElement('div');
        body.className = 'body';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = t.title;
        const meta = document.createElement('div');
        meta.className = 'meta';
        const pill = document.createElement('span');
        pill.className = `pill ${t.priority}`;
        pill.textContent = t.priority;
        meta.append(pill);
        const due = dueInfo(t.due_date);
        if (due) {
          const chip = document.createElement('span');
          chip.className = `due ${t.done ? '' : due.cls}`;
          chip.textContent = due.text;
          meta.append(chip);
        }
        body.append(title, meta);

        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.innerHTML = ICON_TRASH;
        del.setAttribute('aria-label', `Delete "${t.title}"`);
        del.title = 'Delete';
        del.onclick = () => run(() => api(`/tasks/${t.id}`, { method: 'DELETE' }));

        li.append(check, body, del);
        list.append(li);
      }
    }

    async function load() {
      try {
        tasks = await api('/tasks');
        showError('');
      } catch {
        showError('Could not reach the API. Please try again in a moment.');
      }
      render();
    }

    async function run(action) {
      try { await action(); } catch (err) { showError(err.message); }
      load();
    }

    // ---------- Events ----------
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.onclick = () => {
        filter = tab.dataset.filter;
        document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
        render();
      };
    });

    $('form').onsubmit = async (ev) => {
      ev.preventDefault();
      const body = { title: $('title').value, priority: $('priority').value, due_date: $('due_date').value };
      $('add').disabled = true;
      try {
        await api('/tasks', { method: 'POST', body: JSON.stringify(body) });
        $('title').value = ''; $('due_date').value = '';
        $('title').focus();
        await load();
      } catch (err) {
        showError(err.message);
      } finally {
        $('add').disabled = false;
      }
    };

    load();
  </script>
</body>

</html>
