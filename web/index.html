<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f9; --surface: #ffffff; --surface-2: #f7f8fb; --border: #e3e6ee;
    --text: #111827; --muted: #6b7280; --accent: #4f46e5; --accent-2: #7c3aed; --accent-soft: #eef2ff;
    --danger: #dc2626; --danger-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 10px 30px rgba(17, 24, 39, .07);
    /* note colors: tint (background) and dot (strong) */
    --yellow-tint: #fffbea; --yellow: #f5b800;
    --blue-tint: #eff6ff;   --blue: #3b82f6;
    --green-tint: #effcf3;  --green: #22c55e;
    --pink-tint: #fdf0f6;   --pink: #ec4899;
    --purple-tint: #f6f1ff; --purple: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0f1a; --surface: #131a2a; --surface-2: #0f1524; --border: #232c42;
      --text: #e5e7eb; --muted: #9aa3b5; --accent: #818cf8; --accent-2: #a78bfa; --accent-soft: #1d2343;
      --danger: #f87171; --danger-soft: #2a1618; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
      --yellow-tint: #221d0c; --blue-tint: #0f1a2e; --green-tint: #0d2117; --pink-tint: #26111c; --purple-tint: #1b142e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0f1a; --surface: #131a2a; --surface-2: #0f1524; --border: #232c42;
    --text: #e5e7eb; --muted: #9aa3b5; --accent: #818cf8; --accent-2: #a78bfa; --accent-soft: #1d2343;
    --danger: #f87171; --danger-soft: #2a1618; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    --yellow-tint: #221d0c; --blue-tint: #0f1a2e; --green-tint: #0d2117; --pink-tint: #26111c; --purple-tint: #1b142e;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    font: 15px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent;
    display: grid; place-items: center; color: var(--muted); flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border); }
  .icon-btn:focus-visible, .field:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 1px; }

  /* ---------- Top bar ---------- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex: none;
    background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff;
  }
  .logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.18); flex: none; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .8; pointer-events: none; }
  .search input {
    width: 100%; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); outline: none;
    background: rgba(255,255,255,.15); color: #fff; padding: 0 12px 0 36px;
  }
  .search input::placeholder { color: rgba(255,255,255,.75); }
  .search input:focus { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.5); }
  header .icon-btn { color: #fff; background: rgba(255,255,255,.15); }
  header .icon-btn:hover { background: rgba(255,255,255,.28); border-color: transparent; color: #fff; }

  /* ---------- Two panes ---------- */
  .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .side-head { padding: 12px; border-bottom: 1px solid var(--border); }
  .new-btn {
    width: 100%; height: 42px; border: 0; border-radius: 10px; font-weight: 600; color: #fff;
    background: linear-gradient(120deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .new-btn:hover { filter: brightness(1.08); }
  .notes { flex: 1; overflow-y: auto; padding: 6px; }
  .group { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 4px; }
  .item {
    width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px;
    padding: 10px 10px 10px 14px; display: block; position: relative; margin-bottom: 2px;
  }
  .item::before { content: ""; position: absolute; left: 4px; top: 12px; bottom: 12px; width: 4px; border-radius: 4px; background: var(--dot); }
  .item:hover { background: var(--surface-2); }
  .item.active { background: var(--tint); border-color: var(--border); }
  .item-top { display: flex; align-items: center; gap: 6px; }
  .item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .item-title.untitled { color: var(--muted); font-weight: 500; font-style: italic; }
  .item-pin { color: var(--accent); flex: none; }
  .item-preview { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .item-time { color: var(--muted); font-size: 12px; margin-top: 2px; opacity: .8; }
  mark { background: color-mix(in srgb, var(--yellow) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .side-foot { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .side-foot code { font-size: 11px; background: var(--surface-2); border: 1px solid var(--border); padding: 0 5px; border-radius: 5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }

  .side-empty { padding: 32px 18px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ---------- Editor ---------- */
  .editor { background: var(--tint, var(--surface)); transition: background .2s; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .back { display: none; }
  .swatches { display: flex; gap: 6px; padding: 0 6px; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--border); padding: 0; }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--text); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
  .icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
  .spacer { flex: 1; }
  .status { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status.dirty { color: var(--accent); font-weight: 500; }
  .save-btn {
    height: 36px; padding: 0 16px; border-radius: 9px; border: 0; font-weight: 600; color: #fff;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
  }
  .save-btn:disabled { opacity: .45; cursor: default; }
  .write { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 22px 10px; }
  .title-input { border: 0; outline: none; background: transparent; font-size: 26px; font-weight: 700; letter-spacing: -.01em; padding: 4px 0; }
  .body-input { flex: 1; border: 0; outline: none; background: transparent; resize: none; font-size: 16px; line-height: 1.7; padding: 8px 0; min-height: 200px; }
  .title-input::placeholder, .body-input::placeholder { color: var(--muted); opacity: .7; }
  .write-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 8px 22px 12px; }

  .placeholder { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .placeholder strong { display: block; color: var(--text); font-size: 17px; margin: 10px 0 4px; }

  #error {
    display: none; position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10;
    background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; max-width: calc(100% - 32px);
  }
  #error.show { display: block; }

  .skeleton { height: 54px; margin: 6px; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2), var(--border), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Phone: list and editor take turns ---------- */
  @media (max-width: 760px) {
    header h1 { display: none; }
    .search { margin-left: 0; }
    .app { grid-template-columns: 1fr; padding: 12px; }
    .app.editing .sidebar { display: none; }
    .app:not(.editing) .editor { display: none; }
    .back { display: grid; }
    .write { padding: 14px 16px 8px; }
    .title-input { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
    </div>
    <h1>Cloud Notes</h1>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
    </label>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </header>

  <div class="app" id="app">
    <aside class="pane sidebar" aria-label="Notes">
      <div class="side-head">
        <button class="new-btn" id="new" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New note
        </button>
      </div>
      <div class="notes" id="notes"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div class="side-foot"><span id="count"></span><span>release <code title="__APP_VERSION__">__APP_VERSION__</code></span></div>
    </aside>

    <section class="pane editor" id="editor" aria-label="Editor">
      <div class="placeholder" id="placeholder">
        <div>
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>
          <strong>Select a note or start a new one</strong>
          <span>Your notes are saved in Amazon RDS.</span>
        </div>
      </div>

      <div id="form" hidden style="display:flex; flex-direction:column; flex:1; min-height:0">
        <div class="toolbar">
          <button class="icon-btn back" id="back" type="button" aria-label="Back to notes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="swatches" role="group" aria-label="Note color" id="swatches"></div>
          <button class="icon-btn" id="pin" type="button" aria-pressed="false" aria-label="Pin note" title="Pin to top">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M9 10.76V5h6v5.76l2.5 3.24H6.5z"/><path d="M8 5h8"/></svg>
          </button>
          <button class="icon-btn danger" id="delete" type="button" aria-label="Delete note" title="Delete note">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          </button>
          <span class="spacer"></span>
          <span class="status" id="status"></span>
          <button class="save-btn" id="save" type="button" disabled title="Save (Ctrl+S)">Save</button>
        </div>
        <div class="write">
          <input class="title-input" id="title" placeholder="Title" maxlength="120" aria-label="Title" autocomplete="off">
          <textarea class="body-input" id="body" placeholder="Start writing…" maxlength="10000" aria-label="Note text"></textarea>
        </div>
        <div class="write-foot"><span id="chars"></span><span>Ctrl+S to save</span></div>
      </div>
    </section>
  </div>

  <div id="error" role="alert"></div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['yellow', 'blue', 'green', 'pink', 'purple'];

let notes = [];        // as returned by the API
let current = null;    // the note open in the editor ({ id: null } = not saved yet)
let saved = null;      // snapshot of current at last save, to detect unsaved changes
let query = '';

// ---------- Theme ----------
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
$('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
};

// ---------- API ----------
async function api(path, options = {}) {
  const res = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...options });
  if (!res.ok && res.status !== 204) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed');
  return res.status === 204 ? null : res.json();
}

let errorTimer;
function showError(msg) {
  $('error').textContent = msg;
  $('error').classList.add('show');
  clearTimeout(errorTimer);
  errorTimer = setTimeout(() => $('error').classList.remove('show'), 4000);
}

// ---------- Helpers ----------
function timeAgo(ts) {
  if (!ts) return '';
  const date = new Date(ts.replace(' ', 'T') + 'Z');
  const s = Math.max(0, (Date.now() - date) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} d ago`;
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

// Puts text into an element, wrapping search matches in <mark> (no innerHTML with user text).
function setHighlighted(el, text) {
  el.replaceChildren();
  if (!query) { el.textContent = text; return; }
  const lower = text.toLowerCase();
  const q = query.toLowerCase();
  let i = 0;
  for (let at = lower.indexOf(q); at !== -1; at = lower.indexOf(q, i)) {
    el.append(text.slice(i, at));
    const m = document.createElement('mark');
    m.textContent = text.slice(at, at + q.length);
    el.append(m);
    i = at + q.length;
  }
  el.append(text.slice(i));
}

function colorVars(el, color) {
  el.style.setProperty('--dot', `var(--${color})`);
  el.style.setProperty('--tint', `var(--${color}-tint)`);
}

const isDirty = () => current && saved &&
  (current.title !== saved.title || current.body !== saved.body || current.color !== saved.color || current.pinned !== saved.pinned);

function confirmDiscard() {
  return !isDirty() || confirm('You have unsaved changes. Discard them?');
}

// ---------- Sidebar ----------
function renderList() {
  const list = $('notes');
  list.replaceChildren();
  const q = query.toLowerCase();
  const shown = notes.filter((n) => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
  $('count').textContent = `${notes.length} note${notes.length === 1 ? '' : 's'}`;

  if (!shown.length) {
    const div = document.createElement('div');
    div.className = 'side-empty';
    div.textContent = notes.length ? `No notes match "${query}".` : 'No notes yet. Click "New note" to write your first one.';
    list.append(div);
    return;
  }

  const groups = [['Pinned', shown.filter((n) => n.pinned)], ['Notes', shown.filter((n) => !n.pinned)]];
  for (const [label, items] of groups) {
    if (!items.length) continue;
    if (groups[0][1].length) {
      const g = document.createElement('div');
      g.className = 'group';
      g.textContent = label;
      list.append(g);
    }
    for (const n of items) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'item' + (current && current.id === n.id ? ' active' : '');
      colorVars(btn, n.color);

      const top = document.createElement('div');
      top.className = 'item-top';
      const title = document.createElement('span');
      title.className = 'item-title' + (n.title ? '' : ' untitled');
      setHighlighted(title, n.title || 'Untitled');
      top.append(title);
      if (n.pinned) {
        const pin = document.createElement('span');
        pin.className = 'item-pin';
        pin.setAttribute('aria-label', 'Pinned');
        pin.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 4h6v6.76l2.5 3.24H13v7l-1 1-1-1v-7H6.5L9 10.76z"/></svg>';
        top.append(pin);
      }
      const preview = document.createElement('div');
      preview.className = 'item-preview';
      setHighlighted(preview, n.body.replace(/\s+/g, ' ').trim() || 'No text');
      const time = document.createElement('div');
      time.className = 'item-time';
      time.textContent = timeAgo(n.updated_at);

      btn.append(top, preview, time);
      btn.onclick = () => { if (current && current.id === n.id) { openEditor(); return; } if (confirmDiscard()) open(n); };
      list.append(btn);
    }
  }
}

// ---------- Editor ----------
for (const c of COLORS) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch';
  b.dataset.color = c;
  b.style.setProperty('--c', `var(--${c})`);
  b.setAttribute('aria-label', c);
  b.title = c[0].toUpperCase() + c.slice(1);
  b.onclick = () => { current.color = c; renderEditor(); };
  $('swatches').append(b);
}

function open(note) {
  current = { ...note };
  saved = { ...note };
  renderEditor();
  renderList();
  openEditor();
}

function openEditor() {
  $('app').classList.add('editing');
}

function renderEditor() {
  const has = Boolean(current);
  $('placeholder').hidden = has;
  $('form').hidden = !has;
  $('form').style.display = has ? 'flex' : 'none';
  if (!has) { $('editor').style.removeProperty('--tint'); return; }

  colorVars($('editor'), current.color);
  if ($('title').value !== current.title) $('title').value = current.title;
  if ($('body').value !== current.body) $('body').value = current.body;
  for (const s of $('swatches').children) s.setAttribute('aria-pressed', String(s.dataset.color === current.color));
  $('pin').setAttribute('aria-pressed', String(current.pinned));
  $('pin').title = current.pinned ? 'Unpin' : 'Pin to top';
  $('delete').hidden = current.id === null;

  const dirty = isDirty() || current.id === null;
  const empty = !current.title.trim() && !current.body.trim();
  $('save').disabled = !dirty || empty;
  $('status').className = 'status' + (dirty ? ' dirty' : '');
  $('status').textContent = current.id === null ? 'New note' : dirty ? 'Unsaved changes' : `Saved · ${timeAgo(current.updated_at)}`;
  $('chars').textContent = `${current.body.length.toLocaleString()} / 10,000 characters`;
}

$('title').oninput = () => { current.title = $('title').value; renderEditor(); };
$('body').oninput = () => { current.body = $('body').value; renderEditor(); };
$('pin').onclick = () => { current.pinned = !current.pinned; renderEditor(); };

async function save() {
  if (!current || $('save').disabled) return;
  $('save').disabled = true;
  const payload = { title: current.title, body: current.body, color: current.color, pinned: current.pinned };
  try {
    const result = current.id === null
      ? await api('/notes', { method: 'POST', body: JSON.stringify(payload) })
      : await api(`/notes/${current.id}`, { method: 'PATCH', body: JSON.stringify(payload) });
    current = { ...result };
    saved = { ...result };
    await load();
  } catch (err) {
    showError(err.message);
  }
  renderEditor();
}
$('save').onclick = save;

$('delete').onclick = async () => {
  if (!current || current.id === null) return;
  if (!confirm(`Delete "${current.title || 'Untitled'}"? This cannot be undone.`)) return;
  try {
    await api(`/notes/${current.id}`, { method: 'DELETE' });
    current = saved = null;
    $('app').classList.remove('editing');
    renderEditor();
    await load();
  } catch (err) { showError(err.message); }
};

$('new').onclick = () => {
  if (!confirmDiscard()) return;
  open({ id: null, title: '', body: '', color: 'yellow', pinned: false });
  $('title').focus();
};

$('back').onclick = () => {
  if (!confirmDiscard()) return;
  if (current && current.id === null) current = saved = null;
  else if (current) current = { ...saved };
  $('app').classList.remove('editing');
  renderEditor();
  renderList();
};

$('search').oninput = () => { query = $('search').value.trim(); renderList(); };

document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

// ---------- Load ----------
async function load() {
  try {
    notes = await api('/notes');
  } catch {
    showError('Could not reach the API. Please try again in a moment.');
  }
  renderList();
}

load();
setInterval(() => { renderList(); if (current && !isDirty()) renderEditor(); }, 60000); // refresh "x min ago"
</script>
</body>
</html>
