<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Notes Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=__APP_VERSION__">
</head>

<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
        <path d="M14 3v6h6M8 13h8M8 17h5" />
      </svg>
    </div>
    <h1> Notes Taking</h1>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
    </label>
    <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>
  </header>

  <div class="app" id="app">
    <aside class="pane sidebar" aria-label="Notes">
      <div class="side-head">
        <button class="new-btn" id="new" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New note
        </button>
      </div>
      <div class="notes" id="notes">
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      </div>
      <div class="side-foot"><span id="count"></span><span>release <code
            title="__APP_VERSION__">__APP_VERSION__</code></span></div>
    </aside>

    <section class="pane editor" id="editor" aria-label="Editor">
      <div class="placeholder" id="placeholder">
        <div>
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round" opacity=".5">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
            <path d="M14 3v6h6M8 13h8M8 17h5" />
          </svg>
          <strong>Select a note or start a new one</strong>
          <span>Your notes are saved in Amazon RDS.</span>
        </div>
      </div>

      <div id="form" hidden style="display:flex; flex-direction:column; flex:1; min-height:0">
        <div class="toolbar">
          <button class="icon-btn back" id="back" type="button" aria-label="Back to notes">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <div class="swatches" role="group" aria-label="Note color" id="swatches"></div>
          <button class="icon-btn" id="pin" type="button" aria-pressed="false" aria-label="Pin note" title="Pin to top">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 17v5M9 10.76V5h6v5.76l2.5 3.24H6.5z" />
              <path d="M8 5h8" />
            </svg>
          </button>
          <button class="icon-btn danger" id="delete" type="button" aria-label="Delete note" title="Delete note">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" />
            </svg>
          </button>
          <span class="spacer"></span>
          <span class="status" id="status"></span>
          <button class="save-btn" id="save" type="button" disabled title="Save (Ctrl+S)">Save</button>
        </div>
        <div class="write">
          <input class="title-input" id="title" placeholder="Title" maxlength="120" aria-label="Title"
            autocomplete="off">
          <textarea class="body-input" id="body" placeholder="Start writing…" maxlength="10000"
            aria-label="Note text"></textarea>
        </div>
        <div class="write-foot"><span id="chars"></span><span>Ctrl+S to save</span></div>
      </div>
    </section>
  </div>

  <div id="error" role="alert"></div>

  <script src="app.js?v=__APP_VERSION__"></script>
</body>

</html>
